# =====================================================================
# Perfil de producción
# Todos los valores sensibles se toman de variables de entorno.
# =====================================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# HTTPS: activa SSL_ENABLED=true y define el keystore, o termina TLS en
# un proxy inverso y deja SSL_ENABLED=false con forward-headers-strategy.
server.ssl.enabled=${SSL_ENABLED:false}
server.ssl.key-store=${SSL_KEY_STORE:}
server.ssl.key-store-password=${SSL_KEY_STORE_PASSWORD:}
server.ssl.key-store-type=${SSL_KEY_STORE_TYPE:PKCS12}
server.forward-headers-strategy=framework

server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

app.security.remember-me-key=${REMEMBER_ME_KEY}
app.jwt.secret=${JWT_SECRET}

logging.level.root=INFO
logging.level.com.mundomanitas=INFO
