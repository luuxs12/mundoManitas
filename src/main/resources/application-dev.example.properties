# =====================================================================
# Perfil de desarrollo local (PostgreSQL) - PLANTILLA
#
# Copia este archivo como application-dev.properties y ajusta la
# contraseña, o exporta las variables de entorno DB_URL, DB_USERNAME y
# DB_PASSWORD. El archivo application-dev.properties está en .gitignore
# para no publicar credenciales locales.
# =====================================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mundo_manitas}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:cambia_esta_contrasena}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

logging.level.com.mundomanitas=DEBUG
logging.level.org.hibernate.SQL=WARN
