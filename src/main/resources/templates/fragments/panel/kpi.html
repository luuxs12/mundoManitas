<div xmlns:th="http://www.thymeleaf.org" th:fragment="grid(kpis)" class="kpi-grid">
    <a class="kpi-card" th:each="kpi : ${kpis}" th:classappend="|tone-${kpi.tono}|" th:href="${kpi.ruta}">
        <span class="kpi-head">
            <span class="kpi-label" th:text="${kpi.etiqueta}">Indicador</span>
            <span class="kpi-icon" aria-hidden="true">
                <th:block th:switch="${kpi.icono}">
                    <svg th:case="'curso'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H11v17H6.5A2.5 2.5 0 0 0 4 22V5.5Z"></path><path d="M20 5.5A2.5 2.5 0 0 0 17.5 3H13v17h4.5A2.5 2.5 0 0 1 20 22V5.5Z"></path></svg>
                    <svg th:case="'alumnos'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"></circle><path d="M3.5 20c0-3.2 2.5-5.5 5.5-5.5s5.5 2.3 5.5 5.5"></path><path d="M16 5.2a3 3 0 0 1 0 5.6"></path><path d="M17.5 14.6c1.8.6 3 2.4 3 4.4"></path></svg>
                    <svg th:case="'progreso'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18"></path><path d="M6 20v-6"></path><path d="M11 20V9"></path><path d="M16 20V5"></path><path d="M21 20v-9"></path></svg>
                    <svg th:case="'alerta'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2.8 19.2h18.4L12 3Z"></path><path d="M12 9v4.5"></path><path d="M12 17h.01"></path></svg>
                    <svg th:case="'check'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="m8 12 2.5 2.5L16 9"></path></svg>
                    <svg th:case="'docente'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.4"></circle><path d="M5 20c0-3.6 3.1-6.2 7-6.2s7 2.6 7 6.2"></path></svg>
                    <svg th:case="'postulacion'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8l-5-5Z"></path><path d="M14 3v5h5"></path><path d="M9 13h6"></path><path d="M9 17h4"></path></svg>
                    <svg th:case="*" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v4l2.5 2"></path></svg>
                </th:block>
            </span>
        </span>

        <strong class="kpi-value" th:text="${kpi.valor}">0</strong>

        <span class="kpi-foot">
            <span class="kpi-detail" th:text="${kpi.detalle}">Detalle del indicador</span>
            <span class="kpi-arrow" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="m13 6 6 6-6 6"></path></svg>
            </span>
        </span>
    </a>
</div>
