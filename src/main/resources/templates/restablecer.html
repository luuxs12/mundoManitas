<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Restablecer contraseña | Mundo Manitas</title>

    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/components.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>

<body class="auth-body">

    <main class="auth-card">

        <div class="auth-brand">
            <div class="brand-icon">M</div>

            <div>
                <strong>Mundo Manitas</strong>
                <span>Plataforma educativa</span>
            </div>
        </div>

        <span class="mini-title">NUEVA CONTRASEÑA</span>
        <h1>Restablece tu contraseña</h1>

        <p>
            Crea una contraseña segura: mínimo 8 caracteres, con mayúscula,
            minúscula, número y carácter especial.
        </p>

        <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>

        <form th:action="@{/restablecer}" method="post">

            <input type="hidden" name="token" th:value="${token}">

            <div class="form-field">
                <label for="contrasena">Nueva contraseña</label>
                <input class="form-control"
                       type="password"
                       id="contrasena"
                       name="contrasena"
                       autocomplete="new-password"
                       minlength="8"
                       required>
            </div>

            <div class="form-field">
                <label for="confirmacion">Confirmar contraseña</label>
                <input class="form-control"
                       type="password"
                       id="confirmacion"
                       name="confirmacion"
                       autocomplete="new-password"
                       minlength="8"
                       required>
            </div>

            <button type="submit" class="btn btn-primary btn-full">
                Guardar nueva contraseña
            </button>

        </form>

        <div class="auth-links">
            <a th:href="@{/login}">Volver al inicio de sesión</a>
        </div>

    </main>

</body>

</html>
