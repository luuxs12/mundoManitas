<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error | Mundo Manitas</title>
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/components.css}">
    <style>
        .error-page { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; gap:1.5rem; text-align:center; padding:2rem; }
        .error-code { font-size:6rem; font-weight:800; opacity:0.15; line-height:1; }
        .error-page h1 { font-size:1.75rem; }
        .error-page p { opacity:0.6; max-width:400px; }
    </style>
</head>
<body class="app-body">
    <div class="error-page">
        <div class="error-code" th:text="${status}">500</div>
        <h1>Algo salió mal</h1>
        <p th:text="${mensaje}">Ocurrió un error interno. Por favor intenta de nuevo.</p>
        <a href="/dashboard" class="btn btn-primary">Volver al Dashboard</a>
    </div>
</body>
</html>
