<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Mundo Manitas</title>

    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/components.css}">
    <link rel="stylesheet" th:href="@{/css/layout.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>

<body class="app-body">

    <div class="app-layout">

        <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>

        <main class="main-content">

            <header class="topbar">

                <div>
                    <p class="page-location">Panel principal</p>
                    <h2>Dashboard</h2>
                </div>

                <div class="topbar-user">

                    <div class="user-avatar" th:text="${#strings.substring(nombre, 0, 1)}">
                        M
                    </div>

                    <div class="user-info">

                        <strong th:text="${nombre}">
                            Usuario Mundo Manitas
                        </strong>

                        <span th:text="${rolNombre}">
                            Rol
                        </span>

                    </div>

                </div>

            </header>

            <th:block th:if="${tipo == 'estudiante'}">
                <th:block th:replace="~{fragments/dashboard/estudiante :: contenido}">
                </th:block>
            </th:block>

            <th:block th:if="${tipo == 'padre'}">
                <th:block th:replace="~{fragments/dashboard/padre :: contenido}">
                </th:block>
            </th:block>

            <th:block th:if="${tipo == 'docente'}">
                <th:block th:replace="~{fragments/dashboard/docente :: contenido}">
                </th:block>
            </th:block>

            <th:block th:if="${tipo == 'administrador'}">
                <th:block th:replace="~{fragments/dashboard/administrador :: contenido}">
                </th:block>
            </th:block>

            <th:block th:if="${tipo == 'sistemas'}">
                <th:block th:replace="~{fragments/dashboard/sistemas :: contenido}">
                </th:block>
            </th:block>

        </main>

    </div>

</body>

</html>
