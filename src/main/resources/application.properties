spring.application.name=mundomanitas

# Perfil por defecto para ejecución local
spring.profiles.default=dev

# JPA
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Flyway: migraciones versionadas
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.baseline-description=Esquema inicial de Mundo Manitas

# Seguridad
app.security.remember-me-key=${REMEMBER_ME_KEY:mundo-manitas-remember-key}
app.security.max-intentos=${SECURITY_MAX_INTENTOS:5}
app.security.bloqueo-minutos=${SECURITY_BLOQUEO_MINUTOS:15}
app.security.password-min-length=${SECURITY_PASSWORD_MIN_LENGTH:8}

# JWT (el secreto debe tener al menos 32 caracteres)
app.jwt.secret=${JWT_SECRET:mundo-manitas-jwt-secret-key-super-segura-2026-cambiame}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true
info.app.name=Mundo Manitas
info.app.description=Plataforma educativa inclusiva para la comunidad sorda

