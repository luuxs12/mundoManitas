spring.datasource.url=jdbc:h2:mem:mundomanitas;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway se desactiva en pruebas: Hibernate crea el esquema H2.
spring.flyway.enabled=false

app.jwt.secret=test-secret-key-for-jwt-must-be-at-least-32-characters-long
app.security.max-intentos=5
app.security.bloqueo-minutos=15
